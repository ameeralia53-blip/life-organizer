# This workflow will build a docker container, publish it to Google Container
# Registry, and deploy it to GKE when there is a push to the "main"
# branch.
#if(state.study.length>=15) return toast("الحد الأقصى 15 مادة");
        state.study.push({id:Date.now(),name,hours});
        save(KEYS.study,state.study); render();
      };
      document.querySelectorAll("[data-del-sub]").forEach(b=>{
        b.onclick=()=>{ state.study=state.study.filter(s=>String(s.id)!==b.dataset.delSub); save(KEYS.study,state.study); render(); };
      });

      const timerMin = document.getElementById("timerMin");
      if(timerMin) timerMin.oninput=(e)=> state.timerMinutes = Number(e.target.value||1);

      const startTimer = document.getElementById("startTimer");
      if(startTimer) startTimer.onclick=()=>{
        const total = Math.max(0, Number(state.timerMinutes||0)*60);
        if(!total) return toast("أدخل دقائق صحيحة");
        clearInterval(state.timerInt);
        state.timerLeft = total; state.timerRunning = true; render();
        state.timerInt = setInterval(()=>{
          state.timerLeft--;
          if(state.timerLeft<=0){
            clearInterval(state.timerInt); state.timerRunning=false; state.timerLeft=0; render();
            alert("⏰ انتهى الوقت!");
            beep();
            return;
          }
          render();
        },1000);
      };
      const stopTimer = document.getElementById("stopTimer");
      if(stopTimer) stopTimer.onclick=()=>{
        clearInterval(state.timerInt); state.timerRunning=false; render();
      };

      const downloadJson = document.getElementById("downloadJson");
      if(downloadJson) downloadJson.onclick=()=>{
        const data = {
          weeklyTasks: state.weekly,
          mindMap: state.mind,
          freeNotes: state.notes,
          studyPlan: state.study
        };
        const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json;charset=utf-8"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href=url; a.download="beyadak-archive.json"; a.click();
        URL.revokeObjectURL(url);
      };

      const clearAll = document.getElementById("clearAll");
      if(clearAll) clearAll.onclick=()=>{
        if(!confirm("هل أنت متأكد من مسح جميع البيانات؟")) return;
        Object.values(KEYS).forEach(k=>localStorage.removeItem(k));
        state.weekly = {...defaultWeekly}; state.mind=""; state.notes=""; state.study=[];
        render(); toast("تم مسح جميع البيانات");
      };
    }

    function beep(){
      try{
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type="sine"; o.frequency.setValueAtTime(880, ctx.currentTime);
        g.gain.setValueAtTime(0.001, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime+0.02);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.35);
        o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.36);
      }catch(e){}
    }

    render();
  </script>
</body>
